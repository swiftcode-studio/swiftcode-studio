    <link rel="alternate" hreflang="vi" href="https://swiftcode-studio.com/vi" />

    <!-- Latin and Vietnamese webfonts, loaded without blocking the first paint. Japanese uses system fonts (see site.css). -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,800&family=JetBrains+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,800&family=JetBrains+Mono:wght@400;500&display=swap" /></noscript>

    <script>
      // Mark JS as available (enables reveal-on-scroll) and apply the saved theme before first paint. Dark is the default.
      document.documentElement.classList.add('js');
      try {
        var t = localStorage.getItem('sc-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>

    <!--jsonld-->

  <body data-page="home">
    <div id="root"></div>
